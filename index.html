<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>우리 가족 일정</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#3b82f6">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="가족일정">
<style>
:root{--bg:#f6f7f9;--card:#fff;--text:#1c1e21;--sub:#6b7280;--line:#e5e7eb;--accent:#3b82f6;--accent-bg:#e8f0fe;--danger:#ef4444;--today:#fde68a}
@media (prefers-color-scheme:dark){:root{--bg:#15171a;--card:#202327;--text:#e8eaed;--sub:#9aa0a6;--line:#33373d;--accent:#6ea8fe;--accent-bg:#27324a;--danger:#f87171;--today:#5b4a12}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font:16px/1.5 "Malgun Gothic",system-ui,sans-serif}
.wrap{max-width:720px;margin:0 auto;padding:16px}
.top{display:flex;gap:8px;margin-bottom:16px;align-items:center}
.tabs{display:flex;gap:8px;flex:1}
.tabs button{flex:1;padding:10px;border:1px solid var(--line);background:var(--card);color:var(--text);border-radius:10px;font:inherit;cursor:pointer}
.tabs button.on{background:var(--accent);color:#fff;border-color:var(--accent)}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px;margin-bottom:12px}
input,textarea,select{width:100%;min-width:0;padding:9px 10px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--text);font:inherit}
input[type=color]{padding:2px;height:38px;width:48px}
input[type=checkbox]{width:auto}
textarea{min-height:140px;resize:vertical}
button.pri{white-space:nowrap;background:var(--accent);color:#fff;border:0;border-radius:8px;padding:9px 16px;font:inherit;cursor:pointer}
button.ghost{background:none;border:0;color:var(--sub);cursor:pointer;font:inherit;padding:4px 8px;white-space:nowrap}
button.ghost:hover{color:var(--text)}
.row{display:flex;gap:8px;align-items:center}
.nav{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
.nav b{font-size:18px}
.grid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;text-align:center}
.dow{color:var(--sub);font-size:13px;padding:4px 0}
#calCard{touch-action:pan-y;user-select:none;-webkit-user-select:none}
.day{aspect-ratio:1;border-radius:8px;border:1px solid transparent;background:none;color:var(--text);font:inherit;cursor:pointer;position:relative}
.day:hover{background:var(--accent-bg)}
.day.today{background:var(--today)}
.day.sel{border-color:var(--accent);background:var(--accent-bg)}
.day.sun,.day.hol{color:var(--danger)}
.dots{position:absolute;bottom:4px;left:0;right:0;display:flex;justify-content:center;gap:2px}
.dots i{width:6px;height:6px;border-radius:50%}
.item{display:flex;gap:10px;align-items:center;padding:8px 0;border-bottom:1px solid var(--line);margin-bottom:4px}
.item .bar{width:4px;align-self:stretch;border-radius:2px;flex:none}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{border:2px solid;border-radius:20px;padding:4px 16px;font:inherit;cursor:pointer;background:none;color:var(--text)}
.chip.on{color:#fff}
.item .t{color:var(--sub);font-size:14px;min-width:48px}
.item .x{flex:1;cursor:pointer}
.item small{color:var(--sub)}
.item.done .x{text-decoration:line-through;color:var(--sub)}
.item.hday .x{cursor:default;color:var(--danger)}
.memo{cursor:pointer;border-left:6px solid}
.memo h3{margin:0 0 4px;font-size:16px}
.memo p{margin:0;color:var(--sub);white-space:pre-wrap;overflow:hidden;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical}
.memo small{color:var(--sub)}
.empty{color:var(--sub);text-align:center;padding:20px 0}
dialog{width:min(560px,92vw);max-height:92vh;overflow:auto;border:1px solid var(--line);border-radius:14px;background:var(--card);color:var(--text);padding:16px}
dialog::backdrop{background:#0006}
label{display:block;font-size:14px;color:var(--sub);margin:10px 0 4px}
label.chk{display:flex;gap:8px;align-items:center;color:var(--text);margin:12px 0 0;cursor:pointer}
.status{font-size:12px;color:var(--sub);white-space:nowrap}
/* 기간 고르는 달력 */
.pg{gap:2px 0}
.pd{aspect-ratio:1;border:0;background:none;color:var(--text);font:inherit;font-size:14px;line-height:1.1;padding:0;cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center}
.pd small{font-size:9px;line-height:1;margin-top:1px;min-height:9px}
.pd.hol,.pd.sun{color:var(--danger)}
.pd.in{background:var(--accent-bg)}
.pd.s,.pd.e{background:var(--accent);color:#fff}
.pd.s{border-radius:10px 0 0 10px}
.pd.e{border-radius:0 10px 10px 0}
.pd.solo{border-radius:10px}
.sum{font-size:14px;color:var(--accent);margin:6px 0 0;min-height:21px}
[hidden]{display:none!important}
</style>
</head>
<body>
<div class="wrap">
  <div class="top">
    <div class="tabs">
      <button id="tabS" class="on">📅 일정</button>
      <button id="tabM">📝 메모</button>
    </div>
    <span class="status" id="status"></span>
    <button class="ghost" id="gear" title="설정">⚙️</button>
  </div>

  <section id="vS">
    <div class="card" id="calCard">
      <div class="nav">
        <button class="ghost" id="prev">◀</button>
        <b id="title"></b>
        <button class="ghost" id="next">▶</button>
      </div>
      <div class="grid" id="cal"></div>
    </div>
    <div class="card">
      <div class="row" style="margin-bottom:10px">
        <b id="selLabel" style="flex:1"></b>
        <button class="pri" id="newEv">+ 일정 추가</button>
      </div>
      <div id="evList"></div>
    </div>
  </section>

  <section id="vM" hidden>
    <div class="row" style="margin-bottom:12px">
      <input id="q" placeholder="메모 검색">
      <button class="pri" id="newMemo">+ 새 메모</button>
    </div>
    <div id="memoList"></div>
  </section>
</div>

<dialog id="evDlg">
  <b id="evTitle">일정</b>
  <label>누구 일정 (여러 명 선택 가능)</label>
  <div class="chips" id="eOwners"></div>
  <label>내용</label>
  <input id="eText" placeholder="일정 내용">
  <label>날짜 (시작일을 누르고, 기간이면 끝나는 날을 누르세요)</label>
  <div id="rp"></div>
  <div class="sum" id="rpSum"></div>
  <label>시간 (시를 "종일"로 두면 시간 없음)</label>
  <div class="row"><select id="eH"></select><span>시</span><select id="eM"></select><span>분</span></div>
  <label>반복</label>
  <select id="eRep">
    <option value="">반복 안 함</option>
    <option value="daily">매일</option>
    <option value="weekly">매주</option>
    <option value="monthly">매월</option>
    <option value="yearly">매년</option>
  </select>
  <div id="eUntilBox" hidden>
    <label>반복 끝나는 날 (비워두면 계속 반복)</label>
    <input type="date" id="eUntil">
  </div>
  <label>알림 (시간을 안 정한 일정은 오전 9시 기준)</label>
  <select id="eRemind">
    <option value="">알림 없음</option>
    <option value="0">정시</option>
    <option value="10">10분 전</option>
    <option value="30">30분 전</option>
    <option value="60">1시간 전</option>
    <option value="1440">하루 전</option>
  </select>
  <div id="eNotifyBox" hidden>
    <label>알림 받을 사람 (그 사람 폰에서 알림을 켜 둬야 해요)</label>
    <div class="chips" id="eNotify"></div>
  </div>
  <label class="chk"><input type="checkbox" id="ePriv"> 🔒 나만 보기 (이 폰에만 저장, 상대방·위젯에는 안 보여요)</label>
  <div class="row" style="margin-top:14px;flex-wrap:wrap">
    <button class="ghost" id="eDel" style="color:var(--danger)">삭제</button>
    <button class="ghost" id="eCopy">📋 복사</button>
    <button class="ghost" id="eDup">복제</button>
    <span style="flex:1"></span>
    <button class="ghost" id="eCancel">닫기</button>
    <button class="pri" id="eSave">저장</button>
  </div>
</dialog>

<dialog id="dlg">
  <select id="mOwner" style="margin-bottom:8px"></select>
  <input id="mTitle" placeholder="제목" style="margin-bottom:8px">
  <textarea id="mBody" placeholder="내용"></textarea>
  <label class="chk"><input type="checkbox" id="mPriv"> 🔒 나만 보기 (이 폰에만 저장, 상대방에게는 안 보여요)</label>
  <div class="row" style="margin-top:10px">
    <button class="ghost" id="mPin"></button>
    <button class="ghost" id="mDel" style="color:var(--danger)">삭제</button>
    <span style="flex:1"></span>
    <button class="ghost" id="mCancel">닫기</button>
    <button class="pri" id="mSave">저장</button>
  </div>
</dialog>

<dialog id="set">
  <b>설정</b>
  <label>이 폰의 주인</label>
  <select id="sMe"></select>
  <label>사람 이름 / 색상</label>
  <div id="sPeople"></div>
  <label>공유 서버 주소 (Firebase Realtime Database URL)</label>
  <input id="sUrl" placeholder="https://xxxx-default-rtdb.firebaseio.com" autocapitalize="off" autocorrect="off" autocomplete="off" spellcheck="false" inputmode="url">
  <label>가족 코드 (두 폰에 똑같이 입력, 남에게 알려주지 마세요)</label>
  <input id="sCode" placeholder="예: 우리집-7391" autocapitalize="off" autocorrect="off" autocomplete="off" spellcheck="false">
  <label>푸시 알림 (일정 알림을 이 폰으로 받기)</label>
  <div class="row"><button class="pri" id="pushBtn" type="button">이 폰에서 알림 켜기</button><button class="ghost" id="pushTest" type="button">테스트</button></div>
  <div class="status" id="pushMsg" style="white-space:normal;margin-top:6px"></div>
  <div class="row" style="margin-top:14px">
    <button class="ghost" id="exp">백업 저장</button>
    <button class="ghost" id="imp">백업 불러오기</button>
    <input type="file" id="file" accept=".json" hidden>
    <span style="flex:1"></span>
    <button class="pri" id="sSave">저장</button>
  </div>
  <div class="status" style="margin-top:8px;white-space:normal">🔒 나만 보기 항목은 이 폰에만 있어요. 폰을 바꾸기 전에 "백업 저장"을 해 두세요.</div>
</dialog>

<script>
const $=id=>document.getElementById(id);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const pad=n=>String(n).padStart(2,'0');
const key=d=>`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,6);
const ls={get(k,d){try{return JSON.parse(localStorage.getItem(k))??d}catch(e){return d}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};

const DEFAULT_PEOPLE=[{id:'a',name:'아빠',color:'#3b82f6'},{id:'b',name:'엄마',color:'#ec4899'},{id:'c',name:'아이',color:'#f59e0b'}];
let db=Object.assign({people:DEFAULT_PEOPLE,events:{},memos:{}},ls.get('fam-db',{}));
let priv=Object.assign({events:{},memos:{}},ls.get('fam-priv',{}));   // 나만 보기: 이 폰에만 저장, 서버로 안 보냄
let cfg=Object.assign({url:'',code:'',me:'a'},ls.get('fam-cfg',{}));
let view=new Date(); view.setDate(1);
let sel=key(new Date());
let editing=null, editingEv=null, inflight=0;

const person=id=>db.people.find(p=>p.id===id)||db.people[0];
const arr=o=>Object.values(o||{});
const savePriv=()=>ls.set('fam-priv',priv);
const allEvents=()=>arr(db.events).concat(arr(priv.events));
const allMemos=()=>arr(db.memos).concat(arr(priv.memos));
const findEv=id=>db.events[id]||priv.events[id];
const findMemo=id=>db.memos[id]||priv.memos[id];

/* ---------- 날짜 계산 / 반복 ---------- */
const dn=s=>{const[y,m,d]=s.split('-');return Date.UTC(+y,m-1,+d)/864e5};
const ds=n=>{const t=new Date(n*864e5);return `${t.getUTCFullYear()}-${pad(t.getUTCMonth()+1)}-${pad(t.getUTCDate())}`};
const dayOf=s=>+s.split('-')[2], monOf=s=>+s.split('-')[1];
const dowOf=s=>new Date(dn(s)*864e5).getUTCDay();

// ev가 날짜 d(YYYY-MM-DD)에 걸쳐 있는지
function occurs(ev,d){
  if(!ev.date)return false;
  const s=ev.date,e=ev.end&&ev.end>=s?ev.end:s,D=dn(d),S=dn(s);
  if(!ev.repeat)return D>=S&&D<=dn(e);
  const span=dn(e)-S;
  for(let o=0;o<=span;o++){
    const c=D-o;
    if(c<S)break;
    const cs=ds(c);
    if(ev.until&&cs>ev.until)continue;
    const ok=ev.repeat==='daily'
      ||(ev.repeat==='weekly'&&(c-S)%7===0)
      ||(ev.repeat==='monthly'&&dayOf(cs)===dayOf(s))
      ||(ev.repeat==='yearly'&&dayOf(cs)===dayOf(s)&&monOf(cs)===monOf(s));
    if(ok)return true;
  }
  return false;
}
const ownersOf=e=>e.owners&&e.owners.length?e.owners:[e.owner];
const barOf=e=>{const c=ownersOf(e).map(o=>person(o).color);return c.length>1?`linear-gradient(${c.map((x,i)=>`${x} ${i*100/c.length}% ${(i+1)*100/c.length}%`).join(',')})`:c[0]};
const isDone=(ev,d)=>ev.repeat?!!(ev.doneOn&&ev.doneOn[d]):!!ev.done;
const eventsOn=d=>allEvents().filter(e=>occurs(e,d)).sort((a,b)=>(a.time||'00:00').localeCompare(b.time||'00:00'));
const REP={daily:'매일',weekly:'매주',monthly:'매월',yearly:'매년'};
const md=s=>`${monOf(s)}/${dayOf(s)}`;
const nights=(s,e)=>{const n=dn(e)-dn(s);return n===0?'당일':`${n}박 ${n+1}일`};

/* ---------- 대한민국 공휴일 (음력은 브라우저 내장 한국 달력으로 계산, 대체공휴일 포함) ---------- */
// 선거일·임시공휴일처럼 규칙으로 알 수 없는 날은 여기에 추가
const HOL_EXTRA={
  '2022-03-09':'제20대 대통령선거일','2022-06-01':'제8회 전국동시지방선거일',
  '2024-04-10':'제22대 국회의원선거일','2024-10-01':'임시공휴일(국군의날)',
  '2025-01-27':'임시공휴일','2025-06-03':'제21대 대통령선거일',
  '2026-06-03':'제9회 전국동시지방선거일'
};
const holCache={};
let lunarFmt=null;
try{lunarFmt=new Intl.DateTimeFormat('en-US-u-ca-dangi',{month:'numeric',day:'numeric'})}catch(e){}
function lunarOf(n){
  const p=lunarFmt.formatToParts(new Date(n*864e5+432e5));
  const mo=p.find(x=>x.type==='month').value;
  return {m:/^\d+$/.test(mo)?+mo:0,d:+p.find(x=>x.type==='day').value}; // 윤달은 m=0
}
function holidaysOf(y){
  if(holCache[y])return holCache[y];
  const base={};
  const put=(date,name,kind)=>(base[date]=base[date]||[]).push({name,kind});
  [[1,1,'신정','n'],[3,1,'삼일절','a'],[5,5,'어린이날','k'],[6,6,'현충일','n'],[8,15,'광복절','a'],
   [10,3,'개천절','a'],[10,9,'한글날','a'],[12,25,'성탄절','x']]
    .forEach(([m,d,n,k])=>put(`${y}-${pad(m)}-${pad(d)}`,n,k));
  if(lunarFmt){
    for(let n=Date.UTC(y,0,1)/864e5;n<=Date.UTC(y,11,31)/864e5;n++){
      const l=lunarOf(n);
      if(l.m===1&&l.d===1){put(ds(n-1),'설날 연휴','s');put(ds(n),'설날','s');put(ds(n+1),'설날 연휴','s')}
      if(l.m===8&&l.d===15){put(ds(n-1),'추석 연휴','s');put(ds(n),'추석','s');put(ds(n+1),'추석 연휴','s')}
      if(l.m===4&&l.d===8)put(ds(n),'부처님오신날','b');
    }
  }
  Object.keys(HOL_EXTRA).filter(k=>k.startsWith(y+'-')).forEach(k=>put(k,HOL_EXTRA[k],'e'));
  const out={};
  Object.keys(base).forEach(d=>out[d]=[...new Set(base[d].map(i=>i.name))].join('·'));
  // 대체공휴일: 같은 날 두 공휴일이 겹쳐도 하루만, 다음 첫 비공휴일(일요일 제외)로
  const used=new Set();
  Object.keys(base).sort().forEach(d=>{
    const items=base[d],dow=dowOf(d),overlap=items.length>1;
    const hit=items.find(i=>
      (i.kind==='k'&&y>=2014&&(dow===0||dow===6||overlap))||
      (i.kind==='s'&&y>=2014&&(dow===0||overlap))||
      (i.kind==='a'&&y>=2021&&(dow===0||dow===6||overlap))||
      ((i.kind==='b'||i.kind==='x')&&y>=2023&&(dow===0||dow===6||overlap)));
    if(!hit)return;
    let n=dn(d)+1;
    while(new Date(n*864e5).getUTCDay()===0||base[ds(n)]||used.has(ds(n)))n++;
    used.add(ds(n));
    out[ds(n)]=`대체공휴일(${hit.name.replace(' 연휴','')})`;
  });
  return holCache[y]=out;
}
const holidayName=d=>holidaysOf(+d.slice(0,4))[d]||'';

/* ---------- 저장 / 동기화 ---------- */
const base=()=>cfg.url&&cfg.code?`${cfg.url.replace(/\/+$/,'')}/rooms/${encodeURIComponent(cfg.code)}`:'';
const saveLocal=()=>ls.set('fam-db',db);
async function push(path,val){
  saveLocal();
  if(!base())return;
  inflight++;
  try{await fetch(`${base()}/${path}.json`,{method:val===null?'DELETE':'PUT',body:JSON.stringify(val)});setStatus('ok')}
  catch(e){setStatus('err')}
  finally{inflight--}
}
async function pull(){
  if(!base()||inflight)return;
  try{
    const r=await fetch(`${base()}.json`);
    if(!r.ok)throw 0;
    const d=await r.json();
    if(d===null){await fetch(`${base()}.json`,{method:'PUT',body:JSON.stringify(db)})}
    else{db={people:d.people||db.people,events:d.events||{},memos:d.memos||{}};saveLocal()}
    setStatus('ok');renderAll();
  }catch(e){setStatus('err')}
}
function setStatus(s){
  $('status').textContent=!base()?'● 이 폰에만 저장':s==='err'?'● 연결 안 됨':'● 공유 중';
  $('status').style.color=!base()?'':s==='err'?'#ef4444':'#22c55e';
}
setInterval(pull,5000);
document.addEventListener('visibilitychange',()=>{if(!document.hidden)pull()});

// 공유(서버) ↔ 나만 보기(이 폰) 저장 위치를 priv 값에 따라 옮겨 준다
function storeItem(kind,item){
  const shared=db[kind],mine=priv[kind];
  if(item.priv){
    if(shared[item.id]){delete shared[item.id];push(`${kind}/${item.id}`,null)}
    mine[item.id]=item;savePriv();
  }else{
    if(mine[item.id]){delete mine[item.id];savePriv()}
    shared[item.id]=item;push(`${kind}/${item.id}`,item);
  }
}
function removeItem(kind,id){
  if(db[kind][id]){delete db[kind][id];push(`${kind}/${id}`,null)}
  if(priv[kind][id]){delete priv[kind][id];savePriv()}
}

/* ---------- 공통 UI ---------- */
function fillOwner(sel,val){
  sel.innerHTML=db.people.map(p=>`<option value="${p.id}">${esc(p.name)}</option>`).join('');
  sel.value=val;
}
function tab(s){$('vS').hidden=!s;$('vM').hidden=s;$('tabS').classList.toggle('on',s);$('tabM').classList.toggle('on',!s);}
$('tabS').onclick=()=>tab(true); $('tabM').onclick=()=>{tab(false);renderMemos()};

/* ---------- 달력 / 일정 ---------- */
function renderCal(){
  const y=view.getFullYear(),m=view.getMonth();
  $('title').textContent=`${y}년 ${m+1}월`;
  const first=new Date(y,m,1).getDay(), days=new Date(y,m+1,0).getDate(), today=key(new Date());
  let h=['일','월','화','수','목','금','토'].map(d=>`<div class="dow">${d}</div>`).join('');
  for(let i=0;i<first;i++)h+='<div></div>';
  for(let d=1;d<=days;d++){
    const k=`${y}-${pad(m+1)}-${pad(d)}`, dow=(first+d-1)%7;
    const owners=[...new Set(eventsOn(k).flatMap(ownersOf))].slice(0,4);
    h+=`<button class="day${k===today?' today':''}${k===sel?' sel':''}${dow===0?' sun':''}${holidayName(k)?' hol':''}" data-k="${k}">${d}<span class="dots">${owners.map(o=>`<i style="background:${person(o).color}"></i>`).join('')}</span></button>`;
  }
  $('cal').innerHTML=h;
  $('cal').querySelectorAll('.day').forEach(b=>b.onclick=()=>{sel=b.dataset.k;renderCal();renderEv()});
}
function renderEv(){
  const [,m,d]=sel.split('-');
  $('selLabel').textContent=`${+m}월 ${+d}일 일정`;
  const hn=holidayName(sel);
  const hrow=hn?`<div class="item hday"><i class="bar" style="background:var(--danger)"></i><span class="t">공휴일</span><span class="x">🎌 ${esc(hn)}</span></div>`:'';
  const list=eventsOn(sel);
  $('evList').innerHTML=hrow+(list.length?list.map(e=>{
    const range=e.end&&e.end>e.date?` · ${md(e.date)}~${md(e.end)} ${nights(e.date,e.end)}`:'';
    const rep=e.repeat?` · 🔁${REP[e.repeat]}`:'';
    return `
    <div class="item${isDone(e,sel)?' done':''}">
      <i class="bar" style="background:${barOf(e)}"></i>
      <input type="checkbox" data-c="${e.id}" ${isDone(e,sel)?'checked':''}>
      <span class="t">${e.time||'종일'}</span>
      <span class="x" data-e="${e.id}">${e.priv?'🔒 ':''}${esc(e.text)} <small>· ${ownersOf(e).map(o=>esc(person(o).name)).join('·')}${range}${rep}</small></span>
    </div>`}).join(''):(hn?'':'<div class="empty">일정이 없어요</div>'));
  $('evList').querySelectorAll('[data-c]').forEach(c=>c.onchange=()=>{
    const e=findEv(c.dataset.c);
    if(e.repeat){e.doneOn=e.doneOn||{};c.checked?e.doneOn[sel]=true:delete e.doneOn[sel]}
    else e.done=c.checked;
    storeItem('events',e);renderEv();
  });
  $('evList').querySelectorAll('[data-e]').forEach(x=>x.onclick=()=>openEv(findEv(x.dataset.e)));
}
function shift(n){
  view.setMonth(view.getMonth()+n);renderCal();
  try{$('cal').animate([{transform:`translateX(${n*36}px)`,opacity:.25},{transform:'none',opacity:1}],{duration:200,easing:'ease-out'})}catch(e){}
}
$('prev').onclick=()=>shift(-1);
$('next').onclick=()=>shift(1);
// 손가락으로 좌우로 밀어서 월 넘기기
(function(){
  const el=$('calCard');let x0=0,y0=0,on=false;
  el.addEventListener('touchstart',e=>{if(e.touches.length!==1)return;on=true;x0=e.touches[0].clientX;y0=e.touches[0].clientY},{passive:true});
  el.addEventListener('touchend',e=>{
    if(!on)return;on=false;
    const t=e.changedTouches[0],dx=t.clientX-x0,dy=t.clientY-y0;
    if(Math.abs(dx)>50&&Math.abs(dx)>Math.abs(dy)*1.5)shift(dx<0?1:-1);
  },{passive:true});
})();

/* ---------- 기간 고르는 달력 (시작·끝 표시) ---------- */
let rpS='',rpE='',rpV=new Date(),rpFresh=true;
function renderPicker(){
  const y=rpV.getFullYear(),m=rpV.getMonth();
  const first=new Date(y,m,1).getDay(),days=new Date(y,m+1,0).getDate();
  let h=`<div class="nav"><button type="button" class="ghost" data-n="-1">◀</button><b>${y}년 ${m+1}월</b><button type="button" class="ghost" data-n="1">▶</button></div><div class="grid pg">`
    +['일','월','화','수','목','금','토'].map(d=>`<div class="dow">${d}</div>`).join('');
  for(let i=0;i<first;i++)h+='<div></div>';
  for(let d=1;d<=days;d++){
    const k=`${y}-${pad(m+1)}-${pad(d)}`,dow=(first+d-1)%7;
    const isS=k===rpS,isE=k===rpE,inR=rpE&&k>rpS&&k<rpE;
    const cls=['pd',inR?'in':'',isS?'s':'',isE?'e':'',isS&&!rpE?'solo':'',dow===0?'sun':'',holidayName(k)?'hol':''].join(' ');
    h+=`<button type="button" class="${cls}" data-k="${k}">${d}<small>${isS?'시작':isE?'끝':''}</small></button>`;
  }
  $('rp').innerHTML=h+'</div>';
  $('rp').querySelectorAll('[data-n]').forEach(b=>b.onclick=()=>{rpV=new Date(rpV.getFullYear(),rpV.getMonth()+ +b.dataset.n,1);renderPicker()});
  $('rp').querySelectorAll('.pd').forEach(b=>b.onclick=()=>{
    const k=b.dataset.k;
    // 창을 연 뒤 첫 번째 터치, 이미 기간을 고른 뒤의 터치, 시작보다 앞의 날은 '새 시작일'
    if(rpFresh||!rpS||rpE||k<rpS){rpS=k;rpE='';rpFresh=false}
    else if(k>rpS)rpE=k;                  // 시작 뒤의 날을 누르면 끝
    renderPicker();
  });
  $('rpSum').textContent=!rpS?'':rpE?`${md(rpS)} ~ ${md(rpE)} (${nights(rpS,rpE)})`:`${md(rpS)} 하루 일정 · 끝나는 날을 누르면 기간이 돼요`;
}

/* ---------- 일정 입력창 ---------- */
$('eH').innerHTML='<option value="">종일</option>'+Array.from({length:24},(_,i)=>`<option value="${pad(i)}">${pad(i)}</option>`).join('');
$('eM').innerHTML=Array.from({length:12},(_,i)=>`<option value="${pad(i*5)}">${pad(i*5)}</option>`).join('');
$('eRep').onchange=()=>{$('eUntilBox').hidden=!$('eRep').value};

let evOwners=new Set();
function renderOwnerChips(){
  $('eOwners').innerHTML=db.people.map(p=>{
    const on=evOwners.has(p.id);
    return `<button type="button" class="chip${on?' on':''}" data-p="${p.id}" style="border-color:${p.color};${on?`background:${p.color}`:''}">${esc(p.name)}</button>`;
  }).join('');
  $('eOwners').querySelectorAll('.chip').forEach(b=>b.onclick=()=>{
    const id=b.dataset.p;
    if(evOwners.has(id)){if(evOwners.size>1)evOwners.delete(id)} // 최소 1명은 선택
    else evOwners.add(id);
    renderOwnerChips();
  });
}
let evNotify=new Set();
function renderNotifyChips(){
  $('eNotify').innerHTML=db.people.map(p=>{
    const on=evNotify.has(p.id);
    return `<button type="button" class="chip${on?' on':''}" data-p="${p.id}" style="border-color:${p.color};${on?`background:${p.color}`:''}">${esc(p.name)}</button>`;
  }).join('');
  $('eNotify').querySelectorAll('.chip').forEach(b=>b.onclick=()=>{
    const id=b.dataset.p;
    if(evNotify.has(id)){if(evNotify.size>1)evNotify.delete(id)}
    else evNotify.add(id);
    renderNotifyChips();
  });
}
function syncRemindUI(){
  $('eNotifyBox').hidden=!$('eRemind').value;
  if($('eRemind').value)renderNotifyChips();
}
$('eRemind').onchange=()=>{if($('eRemind').value&&!evNotify.size)evNotify=new Set([cfg.me]);syncRemindUI()};
// 나만 보기 일정은 서버에 없어서 알림을 보낼 수 없다
$('ePriv').onchange=()=>{
  const p=$('ePriv').checked;
  $('eRemind').disabled=p;
  if(p)$('eRemind').value='';
  syncRemindUI();
};
function openEv(ev,draft){
  const src=draft||ev;
  editingEv=ev&&!draft?ev:{id:uid()};
  const isNew=!ev||!!draft;
  $('evTitle').textContent=draft?'일정 복제':isNew?'일정 추가':'일정 수정';
  evOwners=new Set(src?ownersOf(src):[cfg.me]);
  renderOwnerChips();
  $('eText').value=src?src.text:'';
  rpS=src?src.date:sel;
  rpE=src&&src.end&&src.end>src.date?src.end:'';
  rpV=new Date(rpS.slice(0,7)+'-01T00:00');
  rpFresh=true;
  renderPicker();
  const [h,mi]=(src&&src.time?src.time:':').split(':');
  $('eH').value=h||'';
  $('eM').value=h?String(Math.round((+mi||0)/5)*5%60).padStart(2,'0'):'00';
  $('eRep').value=src&&src.repeat||'';
  $('eUntil').value=src&&src.until||'';
  $('eUntilBox').hidden=!$('eRep').value;
  $('ePriv').checked=!!(src&&src.priv);
  evNotify=new Set(src&&src.notifyTo&&src.notifyTo.length?src.notifyTo:[cfg.me]);
  $('eRemind').value=src&&src.remind!==undefined&&src.remind!==null&&src.remind!==''?String(src.remind):'';
  $('eRemind').disabled=$('ePriv').checked;
  syncRemindUI();
  $('eDel').hidden=isNew;$('eDup').hidden=isNew;
  $('eCopy').textContent='📋 복사';
  $('evDlg').showModal();
}
$('newEv').onclick=()=>openEv(null);
$('eCancel').onclick=()=>$('evDlg').close();
$('eSave').onclick=()=>{
  const text=$('eText').value.trim();
  if(!text){alert('일정 내용을 입력해 주세요');return}
  if(!rpS){alert('날짜를 골라 주세요');return}
  const ev=Object.assign(editingEv,{
    owner:[...evOwners][0],owners:[...evOwners],text,date:rpS,end:rpE,
    time:$('eH').value?`${$('eH').value}:${$('eM').value}`:'',
    repeat:$('eRep').value,until:$('eRep').value?$('eUntil').value:''
  });
  if(!ev.repeat)delete ev.doneOn;
  const rem=$('ePriv').checked?'':$('eRemind').value;
  if(rem!==''){ev.remind=rem;ev.notifyTo=[...evNotify]}else{delete ev.remind;delete ev.notifyTo}
  if($('ePriv').checked)ev.priv=true;else delete ev.priv;
  storeItem('events',ev);
  sel=rpS;view=new Date(rpS.slice(0,7)+'-01T00:00');
  $('evDlg').close();renderCal();renderEv();
};
$('eDel').onclick=()=>{
  const msg=editingEv.repeat?'반복 일정 전체가 삭제돼요. 삭제할까요?':'이 일정을 삭제할까요?';
  if(confirm(msg)){removeItem('events',editingEv.id);$('evDlg').close();renderCal();renderEv()}
};
async function copyText(t){
  try{await navigator.clipboard.writeText(t)}
  catch(e){const a=document.createElement('textarea');a.value=t;document.body.append(a);a.select();document.execCommand('copy');a.remove()}
}
$('eCopy').onclick=async()=>{
  const h=$('eH').value;
  const when=(rpE?`${rpS} ~ ${rpE}`:rpS)+(h?` ${h}:${$('eM').value}`:'');
  await copyText(`${when} ${$('eText').value.trim()}`);
  $('eCopy').textContent='✓ 복사됨';
};
$('eDup').onclick=()=>{
  $('evDlg').close();
  openEv(editingEv,{owners:[...evOwners],text:$('eText').value,date:rpS,end:rpE,priv:$('ePriv').checked,
    time:$('eH').value?`${$('eH').value}:${$('eM').value}`:'',repeat:$('eRep').value,until:$('eUntil').value,remind:$('eRemind').value,notifyTo:[...evNotify]});
};

/* ---------- 메모 ---------- */
function renderMemos(){
  const q=$('q').value.trim().toLowerCase();
  const list=allMemos().filter(m=>(m.title+m.body).toLowerCase().includes(q))
    .sort((a,b)=>(!!b.pinned-!!a.pinned)||b.updated-a.updated);
  $('memoList').innerHTML=list.length?list.map(m=>`
    <div class="card memo" data-id="${m.id}" style="border-left-color:${person(m.owner).color}">
      <h3>${m.pinned?'📌 ':''}${m.priv?'🔒 ':''}${esc(m.title||'제목 없음')}</h3>
      <p>${esc(m.body)}</p>
      <small>${esc(person(m.owner).name)} · ${new Date(m.updated).toLocaleString('ko-KR')}</small>
    </div>`).join(''):'<div class="empty">메모가 없어요</div>';
  $('memoList').querySelectorAll('.memo').forEach(c=>c.onclick=()=>openMemo(c.dataset.id));
}
function openMemo(id){
  editing=id?{...findMemo(id)}:{id:uid(),title:'',body:'',pinned:false,owner:cfg.me,isNew:true};
  fillOwner($('mOwner'),editing.owner);
  $('mTitle').value=editing.title;$('mBody').value=editing.body;
  $('mPriv').checked=!!editing.priv;
  $('mPin').textContent=editing.pinned?'📌 고정 해제':'📌 고정';
  $('mDel').hidden=!!editing.isNew;
  $('dlg').showModal();
}
$('newMemo').onclick=()=>openMemo();
$('q').oninput=renderMemos;
$('mPin').onclick=()=>{editing.pinned=!editing.pinned;$('mPin').textContent=editing.pinned?'📌 고정 해제':'📌 고정'};
$('mCancel').onclick=()=>$('dlg').close();
$('mSave').onclick=()=>{
  editing.title=$('mTitle').value.trim();editing.body=$('mBody').value;editing.owner=$('mOwner').value;editing.updated=Date.now();
  if($('mPriv').checked)editing.priv=true;else delete editing.priv;
  const isNew=editing.isNew;delete editing.isNew;
  if(!isNew||editing.title||editing.body)storeItem('memos',editing);
  $('dlg').close();renderMemos();
};
$('mDel').onclick=()=>{
  const m=editing.priv?'이 메모를 삭제할까요?':'이 메모를 삭제할까요? (공유된 메모는 상대방 폰에서도 사라져요)';
  if(confirm(m)){removeItem('memos',editing.id);$('dlg').close();renderMemos()}
};

/* ---------- 푸시 알림 ---------- */
// 공개 키라서 코드에 있어도 안전하다. 짝이 되는 비밀 키는 GitHub Secrets에만 둔다.
const VAPID_PUBLIC='BOpzb2HtGdgwjfwYQtz6IWzzFq8mG3iPhG0FCXDAm9dUI-ASBpprPQdfXFRBM1LUiKiCmG5b_sxwgruR-xmXoG4';
const isIOS=/iPad|iPhone|iPod/.test(navigator.userAgent);
const standalone=()=>navigator.standalone||matchMedia('(display-mode: standalone)').matches;
const pushOk=()=>'serviceWorker' in navigator&&'PushManager' in window&&'Notification' in window;
const b64u=s=>{const b=atob((s+'='.repeat((4-s.length%4)%4)).replace(/-/g,'+').replace(/_/g,'/'));return Uint8Array.from(b,c=>c.charCodeAt(0))};
const subId=sub=>sub.endpoint.slice(-24).replace(/[^A-Za-z0-9_-]/g,'_');
async function curSub(){try{const reg=await navigator.serviceWorker.ready;return await reg.pushManager.getSubscription()}catch(e){return null}}
async function savePushSub(sub){
  await fetch(`${base()}/push/${subId(sub)}.json`,{method:'PUT',body:JSON.stringify({person:cfg.me,sub:sub.toJSON(),at:Date.now()})});
}
async function renderPushUI(){
  const btn=$('pushBtn'),msg=$('pushMsg');
  if(!pushOk()||(isIOS&&!standalone())){
    btn.disabled=true;
    msg.textContent=isIOS&&!standalone()?'아이폰은 홈 화면에 추가한 앱에서 열어야 알림을 켤 수 있어요.':'이 브라우저는 푸시 알림을 지원하지 않아요.';
    return;
  }
  const sub=await curSub();
  btn.disabled=false;
  btn.textContent=sub?'알림 끄기':'이 폰에서 알림 켜기';
  msg.textContent=sub?`켜짐 · ${person(cfg.me).name} 폰으로 등록돼 있어요`:(Notification.permission==='denied'?'알림이 차단돼 있어요. 폰 설정에서 이 앱의 알림을 허용해 주세요.':'');
}
$('pushBtn').onclick=async()=>{
  const msg=$('pushMsg');
  if(!base()){msg.textContent='먼저 서버 주소와 가족 코드를 저장해 주세요.';return}
  try{
    const sub=await curSub();
    if(sub){
      const id=subId(sub);
      await sub.unsubscribe();
      await fetch(`${base()}/push/${id}.json`,{method:'DELETE'});
    }else{
      if(await Notification.requestPermission()!=='granted'){msg.textContent='알림이 허용되지 않았어요.';return}
      const reg=await navigator.serviceWorker.ready;
      const s=await reg.pushManager.subscribe({userVisibleOnly:true,applicationServerKey:b64u(VAPID_PUBLIC)});
      await savePushSub(s);
    }
  }catch(e){msg.textContent='알림 설정에 실패했어요: '+(e.message||e);return}
  renderPushUI();
};
$('pushTest').onclick=async()=>{
  try{
    if(!pushOk()||Notification.permission!=='granted'){$('pushMsg').textContent='먼저 알림을 켜 주세요.';return}
    const reg=await navigator.serviceWorker.ready;
    await reg.showNotification('가족 일정',{body:'이 폰에서 알림이 잘 보여요 🔔',icon:'icon-192.png'});
  }catch(e){$('pushMsg').textContent='테스트에 실패했어요: '+(e.message||e)}
};

/* ---------- 설정 ---------- */
$('gear').onclick=()=>{
  fillOwner($('sMe'),cfg.me);
  $('sPeople').innerHTML=db.people.map(p=>`<div class="row" style="margin-bottom:6px"><input data-n="${p.id}" value="${esc(p.name)}"><input type="color" data-k="${p.id}" value="${p.color}"></div>`).join('');
  $('sUrl').value=cfg.url;$('sCode').value=cfg.code;
  renderPushUI();
  $('set').showModal();
};
$('sSave').onclick=()=>{
  db.people.forEach(p=>{p.name=document.querySelector(`[data-n="${p.id}"]`).value.trim()||p.name;p.color=document.querySelector(`[data-k="${p.id}"]`).value});
  let u=$('sUrl').value.trim().replace(/\s+/g,'').replace(/\/+$/,'');
  if(u&&!/^https?:\/\//i.test(u))u='https://'+u;
  cfg={url:u.replace(/^HTTPS?:/,m=>m.toLowerCase()),code:$('sCode').value.trim(),me:$('sMe').value};
  ls.set('fam-cfg',cfg);saveLocal();
  if(base()){push('people',db.people);curSub().then(s=>s&&savePushSub(s)).catch(()=>{})} // 폰 주인이 바뀌면 알림 대상도 갱신
  $('set').close();setStatus('ok');renderAll();pull();
};
$('exp').onclick=()=>{
  const a=document.createElement('a');
  a.href=URL.createObjectURL(new Blob([JSON.stringify({...db,priv},null,2)],{type:'application/json'}));
  a.download=`가족일정_${key(new Date())}.json`;a.click();
};
$('imp').onclick=()=>$('file').click();
$('file').onchange=async e=>{
  try{
    const d=JSON.parse(await e.target.files[0].text());
    if(!d.events||!d.memos||!Array.isArray(d.people))throw 0;
    if(confirm('현재 데이터를 백업 파일 내용으로 바꿀까요?')){
      db={people:d.people,events:d.events,memos:d.memos};saveLocal();
      if(d.priv){priv={events:d.priv.events||{},memos:d.priv.memos||{}};savePriv()}
      if(base())fetch(`${base()}.json`,{method:'PUT',body:JSON.stringify(db)});
      renderAll();
    }
  }catch(_){alert('올바른 백업 파일이 아니에요')}
  e.target.value='';
};

function renderAll(){renderCal();renderEv();renderMemos()}
// 설치 도우미 링크(#s=서버&c=코드&me=주인)로 열면 설정을 자동 입력하고 주소에서 지운다
(function(){
  const h=location.hash.slice(1);
  if(!h.startsWith('s='))return;
  const q=new URLSearchParams(h);
  cfg={url:q.get('s')||'',code:q.get('c')||'',me:q.get('me')||cfg.me};
  ls.set('fam-cfg',cfg);
  try{history.replaceState(null,'',location.pathname+location.search)}catch(e){}
})();
// 위젯의 ＋ 버튼: #add=날짜 로 열면 그 날짜로 일정 추가 창을 연다
(function(){
  const m=location.hash.match(/^#add=(\d{4}-\d{2}-\d{2})/);
  if(!m)return;
  sel=m[1];view=new Date(sel.slice(0,7)+'-01T00:00');
  try{history.replaceState(null,'',location.pathname+location.search)}catch(e){}
  setTimeout(()=>openEv(null),0);
})();
if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});
setStatus('ok');renderAll();pull();
</script>
